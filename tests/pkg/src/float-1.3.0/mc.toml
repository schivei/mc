# float 1.3.0 -- the OVERRIDE fixture (M44 § A5): a registry package carrying a
# name the bundle also serves. A project that pins it gets this tree for
# `<float>` and `<float/float_rt.mc>` instead of the blob; a project that does
# not is byte for byte what it was.
[package]
name   = "float"
files  = ["float.mc", "float_rt.mc", "user_float.mc"]
lib    = "float.mc"
module = "user_float.mc"
