# values.toml — every value shape the subset accepts.
[scalars]
s     = "plain"
esc   = "a\"b\\c\nd\te"
zero  = 0
pos   = +7
neg   = -42
under = 1_000_000
yes   = true
no    = false

# M23: floats are read as BASIS POINTS -- an i64 hundredth of a percent -- so
# `mc build` can carry [limits].tolerance without the language having floats.
[floats]
quarter = 0.25
half    = 0.5
one     = 1.0
tiny    = 0.0001
negative = -1.5

[arrays]
empty  = []
one    = ["only"]
nums   = [1, 2, 3]
multi  = [
    "a",          # a comment inside the array
    "b",
    "c",          # trailing comma below
]
mixed-key_name = ["x"]

[deep.nested.table]
k = "v"

a.dotted.key = "reached"
"quoted key" = "also reached"
