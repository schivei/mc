# sysroot-ok.toml — [sysroot].path at a POPULATED directory: exactly what an
# mc.toml written before M25 says, and it has to keep meaning what it meant.
# The object this build writes is compared byte for byte against the one
# sysroot-cache.toml writes -- where the sysroot came from can never reach the
# generated bytes.
[project]
entry = "lin.mc"
out   = "build/lin-ok"

[target]
os   = "linux"
arch = "aarch64"

[linker]
cmd  = "echo"
args = ["sysroot={sysroot}", "-o", "{out}", "{obj}"]

[sysroot]
path = "build/sysroots/linux-aarch64"
