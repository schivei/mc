# Release — builds the downloadable `mc` for every enabled target and publishes
# a GitHub Release for the tag. Started by autotag.yml when a pull request is
# merged, by tag.yml when a tag is cut by hand, by pushing a `v*` tag, or from
# the Actions tab with the tag as an input. The tag is the only source of
# version truth: there is no VERSION file. See docs/ci.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The targets that exist today. `mc` runs on macOS arm64 only, so this is a
  # one-entry matrix -- the shape is a matrix because the other hosts plug in
  # here unchanged (see build-future-hosts below).
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The version IS the tag, minus the `v`. The only check left is that the
      # tag has the shape a release tag must have; next-version.sh is the one
      # place that knows what a version looks like, so it does the parsing.
      - name: Derive the version from the tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          case "$tag" in
            v*) : ;;
            *) echo "::error::'$tag' is not a release tag (it must start with 'v')"; exit 1 ;;
          esac
          version="${tag#v}"
          if ! scripts/next-version.sh "$version" patch > /dev/null 2>&1; then
            echo "::error::tag '$tag' does not carry a plain X.Y.Z version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "releasing $tag as version $version"

      # The seed compiles once (clang), mc1 compiles itself into the signed,
      # ld-free executable. The output's basename is the identifier of the
      # ad-hoc signature (M11), so it is built directly as `mc`.
      - name: Build the compiler
        run: |
          set -eu
          make mc1
          mkdir -p dist
          rm -f dist/mc
          build/mc1 --exe src/mc.mc -o dist/mc
          ls -l dist/mc

      - name: Verify the signature
        run: |
          set -eu
          codesign --verify --verbose=4 dist/mc
          codesign -dvvv dist/mc 2>&1 | sed -n '1,12p'

      - name: Run the test suite with the binary being shipped
        run: scripts/test.sh dist/mc

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/release-assets.sh "$VERSION" "$TARGET" dist/mc dist

      - name: Upload the packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/mc-*.tar.gz
            dist/mc-*.tar.gz.sha256
          if-no-files-found: error

  # Placeholders, deliberately disabled. They turn on when `mc` itself runs on
  # Linux and Windows -- today it is a macOS arm64 program (docs/plan.md
  # § Phase 2: "mc itself keeps running on macOS arm64 for now; cross-hosting
  # comes later with CI", and docs/build.md § Limits: the driver needs
  # `_NSGetEnviron`, which is libSystem-only). M16 gave Linux arm64 *targets*;
  # hosting mc there is the milestone that flips `if: false` to `if: true`, and
  # Windows waits for the COFF work of M19/M20.
  build-future-hosts:
    name: Build ${{ matrix.target }} (not enabled yet)
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-11-arm
            target: windows-arm64
          - os: windows-2025
            target: windows-x86_64
    steps:
      - name: Not enabled
        env:
          TARGET: ${{ matrix.target }}
        run: echo "waiting on a host build of mc for $TARGET"

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Collect the built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # The release body is the tag's own annotation -- autotag.yml writes the
      # pull request's title and number into it, tag.yml writes the notes the
      # operator typed -- plus the checksums of everything being attached.
      - name: Compose the release body
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" || true
          annotation=$(git tag -l --format='%(contents)' "$tag")
          {
            if [ -n "$annotation" ]; then
              printf '%s\n' "$annotation"
            else
              echo "mc $version"
            fi
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "tar xzf mc-$version-macos-arm64.tar.gz"
            echo "cd mc-$version-macos-arm64"
            echo "xattr -d com.apple.quarantine mc     # ad-hoc signed, not notarized"
            echo "install -m 755 mc /usr/local/bin/mc"
            echo '```'
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # A version with a `-` suffix (0.2.0-rc1) is a pre-release. Neither
          # autotag.yml nor tag.yml makes such a tag -- the project has no
          # pre-releases (docs/ci.md § Versioning) -- but a hand-pushed one
          # still publishes correctly.
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "mc $VERSION" \
            --notes-file "$RUNNER_TEMP/body.md" \
            --verify-tag \
            $prerelease \
            dist/mc-*.tar.gz dist/mc-*.tar.gz.sha256
