# Release — builds the downloadable `mc` for every enabled target and publishes
# a GitHub Release for the tag. Started by autotag.yml when a pull request is
# merged, by tag.yml when a tag is cut by hand, by pushing a `v*` tag, or from
# the Actions tab with the tag as an input. The tag is the only source of
# version truth: there is no VERSION file. See docs/ci.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The macOS host, and the job that compiles everything: it is the only runner
  # with a `mc` on it. It builds and packages the macOS asset, and cross-compiles
  # the two Linux hosts as far as an ELF object -- `build-linux` below links,
  # proves and packages those. A one-entry matrix, because the shape is what the
  # remaining hosts plug into unchanged (see build-future-hosts below).
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The version IS the tag, minus the `v`. The only check left is that the
      # tag has the shape a release tag must have; next-version.sh is the one
      # place that knows what a version looks like, so it does the parsing.
      - name: Derive the version from the tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          case "$tag" in
            v*) : ;;
            *) echo "::error::'$tag' is not a release tag (it must start with 'v')"; exit 1 ;;
          esac
          version="${tag#v}"
          if ! scripts/next-version.sh "$version" patch > /dev/null 2>&1; then
            echo "::error::tag '$tag' does not carry a plain X.Y.Z version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "releasing $tag as version $version"

      # The seed compiles once (clang), mc1 compiles itself into the signed,
      # ld-free executable. The output's basename is the identifier of the
      # ad-hoc signature (M11), so it is built directly as `mc`.
      - name: Build the compiler
        run: |
          set -eu
          make mc1
          mkdir -p dist
          rm -f dist/mc
          build/mc1 --exe src/mc.mc -o dist/mc
          ls -l dist/mc

      - name: Verify the signature
        run: |
          set -eu
          codesign --verify --verbose=4 dist/mc
          codesign -dvvv dist/mc 2>&1 | sed -n '1,12p'

      - name: Run the test suite with the binary being shipped
        run: scripts/test.sh dist/mc

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/release-assets.sh "$VERSION" "$TARGET" dist/mc dist

      # M37: the two Linux hosts. `mc` is one program with a host layer
      # (src/host_linux.mc), not a port, so the compiler that has just
      # bootstrapped is what cross-compiles them -- but only as far as the
      # OBJECT. Linking needs `ld.lld` and a musl sysroot, and this runner has
      # neither (the sysroot is four files copied out of an `alpine:3`
      # container, and GitHub's macOS runners have no Docker). The two jobs
      # below link each object on a real Linux CPU of that architecture,
      # bootstrap it to its own fixed point and package it
      # (docs/ci.md § M37, docs/guide/90-linux-host.md).
      - name: Cross-compile mc for the Linux hosts
        run: |
          set -eu
          make mc-linux-obj
          make mc-linux-x86_64-obj
          ls -l build/mc-linux-arm64.o build/mc-linux-x86_64.o
          for obj in build/mc-linux-arm64.o build/mc-linux-x86_64.o; do
            [ -s "$obj" ] || { echo "::error::$obj was not produced"; exit 1; }
          done
          if command -v file >/dev/null 2>&1; then
            file build/mc-linux-arm64.o build/mc-linux-x86_64.o
            file build/mc-linux-arm64.o  | grep -q 'ELF 64-bit.*aarch64'
            file build/mc-linux-x86_64.o | grep -q 'ELF 64-bit.*x86-64'
          fi

      # M38: the two Windows hosts, the same way and for the same reason. What
      # this runner can produce is the two COFF objects plus everything the link
      # needs and the program does not provide -- winstart.obj (the entry
      # point), mcrt.obj (the POSIX shims over kernel32) and kernel32.lib. The
      # Windows runners have lld-link and no `mc`, so the compiler they link IS
      # this artifact (docs/ci.md, docs/guide/95-windows-host.md).
      - name: Cross-compile mc for the Windows hosts
        run: |
          set -eu
          make mc-windows-obj
          make mc-windows-x86_64-obj
          make mcrt-windows
          make mcrt-windows-x86_64
          ls -l build/mc-windows-arm64.obj build/mc-windows-x86_64.obj
          ls -l build/sysroot/windows-aarch64 build/sysroot/windows-x86_64
          for f in build/mc-windows-arm64.obj build/mc-windows-x86_64.obj \
                   build/sysroot/windows-aarch64/winstart.obj \
                   build/sysroot/windows-aarch64/mcrt.obj \
                   build/sysroot/windows-x86_64/winstart.obj \
                   build/sysroot/windows-x86_64/mcrt.obj; do
            [ -s "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          done
          # kernel32.lib needs llvm-dlltool, which this runner may not have (the
          # suite step above has the same caveat): when it is absent here,
          # scripts/link-windows.sh regenerates it on the Windows runner, where
          # the LLVM install carries the tool.
          for a in aarch64 x86_64; do
            [ -s "build/sysroot/windows-$a/kernel32.lib" ] \
              || echo "::notice::build/sysroot/windows-$a/kernel32.lib absent (no llvm-dlltool here); the Windows runner regenerates it"
          done

      # The suite objects the Windows jobs run: cross-compiled here, linked and
      # executed there, which is the only place a Windows binary runs at all.
      - name: Cross-compile the suite for the Windows hosts
        run: |
          set -eu
          scripts/test-windows.sh --build-only build/windows-objs build/mc1
          scripts/test-windows.sh --arch x86_64 --build-only build/windows-objs-x86_64 build/mc1

      - name: Upload the packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/mc-*.tar.gz
            dist/mc-*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload the cross-compiled Linux objects
        uses: actions/upload-artifact@v4
        with:
          name: mc-linux-objects
          path: |
            build/mc-linux-arm64.o
            build/mc-linux-x86_64.o
          if-no-files-found: error

      - name: Upload the cross-compiled Windows objects
        uses: actions/upload-artifact@v4
        with:
          name: mc-windows-objects
          path: |
            build/mc-windows-arm64.obj
            build/mc-windows-x86_64.obj
            build/sysroot/windows-aarch64
            build/sysroot/windows-x86_64
            build/windows-objs
            build/windows-objs-x86_64
          if-no-files-found: error

  # M37: the Linux half of the release. One job per architecture, each on real
  # hardware of that architecture, because the proof that the shipped binary IS
  # the compiler is that it reproduces itself here: scripts/bootstrap-linux.sh
  # runs seed -> mc1l -> mc2l -> mc3l, `cmp mc2l.o mc3l.o`, the golden, and then
  # the whole suite natively. Only then is the seed packaged.
  #
  # These jobs also produce the `release-linux-*` artifacts the publish job
  # collects, so a release carries three tarballs (docs/ci.md § M37).
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: linux-arm64
            obj: build/mc-linux-arm64.o
            bin: build/mc-linux-arm64
            larch: aarch64
            linkarch: ""
          - os: ubuntu-latest
            target: linux-x86_64
            obj: build/mc-linux-x86_64.o
            bin: build/mc-linux-x86_64
            larch: x86_64
            linkarch: "--arch x86_64"
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The shape of the tag was already validated by the `build` job, which
      # this one needs: if it were malformed nothing here would run. So this is
      # the same derivation without the re-validation.
      - name: Derive the version from the tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "releasing $tag on ${{ matrix.target }}"

      - name: Download the cross-compiled Linux objects
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-objects
          path: build

      - name: Install ld.lld and the musl development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld musl-dev musl-tools
          if ! command -v ld.lld >/dev/null 2>&1; then
            # Debian ships ld.lld under the versioned llvm prefix on some
            # releases; either shape is fine, it just has to be on PATH.
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version
          ls -l /usr/lib/${{ matrix.larch }}-linux-musl/crt1.o \
                /usr/lib/${{ matrix.larch }}-linux-musl/libc.a

      # MC_SYSROOT points at the distribution's own musl files, so
      # scripts/link-linux.sh runs `ld.lld` and nothing else -- it reaches for
      # scripts/sysroot-linux.sh (and Docker) only when one of the four is
      # missing.
      - name: Link the compiler
        env:
          MC_SYSROOT: /usr/lib/${{ matrix.larch }}-linux-musl
        run: |
          set -eu
          # shellcheck disable=SC2086
          scripts/link-linux.sh ${{ matrix.linkarch }} ${{ matrix.bin }} ${{ matrix.obj }}
          chmod 755 ${{ matrix.bin }}
          ls -l ${{ matrix.bin }}

      - name: What this binary says it is
        run: |
          set -eu
          ${{ matrix.bin }} --host
          os=$(${{ matrix.bin }} --host | sed -n 's|^os *||p')
          arch=$(${{ matrix.bin }} --host | sed -n 's|^arch *||p')
          if [ "$os" != "linux" ] || [ "$arch" != "${{ matrix.larch }}" ]; then
            echo "::error::the binary says it is hosted on '$os/$arch', not linux/${{ matrix.larch }}"
            exit 1
          fi

      # The release gate: the binary being shipped compiles itself to a fixed
      # point on this machine and then runs the whole suite. It is the Linux
      # equivalent of the macOS job's `scripts/test.sh dist/mc`, and stronger.
      - name: Bootstrap to a fixed point with the binary being shipped
        env:
          MC_SYSROOT: /usr/lib/${{ matrix.larch }}-linux-musl
        run: scripts/bootstrap-linux.sh ${{ matrix.bin }}

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -eu
          scripts/release-assets.sh "$VERSION" "$TARGET" "$BIN" dist
          ls -l dist

      - name: Upload the packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/mc-*.tar.gz
            dist/mc-*.tar.gz.sha256
          if-no-files-found: error

  # M38: the Windows half of the release, `build-linux`'s shape on Windows
  # hardware. One job per architecture, because the proof that the shipped
  # binary IS the compiler is that it reproduces itself there:
  # scripts/bootstrap-windows.sh runs seed -> mc1w -> mc2w -> mc3w,
  # `cmp mc2w.obj mc3w.obj`, the golden, `--host`, and the whole suite with the
  # compiler that came out. Only then is the seed packaged.
  #
  # These jobs produce the `release-windows-*` artifacts the publish job
  # collects, so a release carries five tarballs (docs/ci.md § M38).
  build-windows:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            target: windows-arm64
            larch: aarch64
            # The directory the `build` job cross-compiled the suite into and
            # packed in the `mc-windows-objects` artifact. Spelled out per entry
            # rather than derived from `larch`: the arm64 tree is the unsuffixed
            # one, and a name that does not exist would silently degrade into
            # rebuilding the whole suite here (scripts/bootstrap-windows.sh
            # falls back when $MC_WINTESTS/manifest is missing).
            objs: build/windows-objs
            llvmkey: woa64
            llvmtriple: aarch64-pc-windows-msvc
            llvminst: woa64
          - os: windows-2025
            target: windows-x86_64
            larch: x86_64
            objs: build/windows-objs-x86_64
            llvmkey: win64
            llvmtriple: x86_64-pc-windows-msvc
            llvminst: win64
    env:
      LLVM_VERSION: "20.1.8"
      # MSYS rewrites an argument that looks like a path -- and every dash-form
      # lld-link option does (docs/specs/M38.md § 7).
      MSYS2_ARG_CONV_EXCL: "*"
      MC_WINTESTS: ${{ matrix.objs }}
    steps:
      # This job COMPILES .mc sources and RUNS shell scripts out of the
      # checkout, and GitHub's Windows images ship core.autocrlf=true, where a
      # `#!/bin/sh\r` is a hard failure.
      - name: Never translate line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The shape of the tag was already validated by the `build` job, which
      # this one needs.
      - name: Derive the version from the tag
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "releasing $tag on ${{ matrix.target }}"

      - name: Download the cross-compiled Windows objects
        uses: actions/download-artifact@v4
        with:
          name: mc-windows-objects
          path: build

      - name: Tool facts
        id: tools
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          uname -s
          uname -m
          if where lld-link 2>/dev/null; then
            echo "found=1" >> "$GITHUB_OUTPUT"
          elif [ -x "/c/Program Files/LLVM/bin/lld-link.exe" ]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "lld-link: absent -- the next step downloads LLVM $LLVM_VERSION"
            echo "found=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the LLVM toolchain
        if: steps.tools.outputs.found != '1'
        uses: actions/cache@v4
        with:
          path: build/llvm
          key: llvm-${{ matrix.llvmkey }}-${{ env.LLVM_VERSION }}

      - name: Obtain lld-link
        if: steps.tools.outputs.found != '1'
        shell: bash
        run: |
          set -e
          if [ ! -x build/llvm/bin/lld-link.exe ]; then
            mkdir -p build/llvm
            base="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION"
            if curl -fSL -o /tmp/llvm.tar.xz "$base/clang+llvm-$LLVM_VERSION-${{ matrix.llvmtriple }}.tar.xz"; then
              tar -xf /tmp/llvm.tar.xz -C build/llvm --strip-components=1
            else
              curl -fSL -o /tmp/llvm.exe "$base/LLVM-$LLVM_VERSION-${{ matrix.llvminst }}.exe"
              7z x -obuild/llvm /tmp/llvm.exe > /dev/null
            fi
          fi
          echo "$PWD/build/llvm/bin" >> "$GITHUB_PATH"
          build/llvm/bin/lld-link.exe --version || true

      - name: Link the compiler
        shell: bash
        run: |
          set -eu
          ls -l build/mc-${{ matrix.target }}.obj build/sysroot/windows-${{ matrix.larch }}
          scripts/link-windows.sh --arch ${{ matrix.larch }} \
              build/mc-${{ matrix.target }}.exe build/mc-${{ matrix.target }}.obj
          ls -l build/mc-${{ matrix.target }}.exe

      - name: What this binary says it is
        shell: bash
        run: |
          set -eu
          build/mc-${{ matrix.target }}.exe --host
          os=$(build/mc-${{ matrix.target }}.exe --host | sed -n 's|^os *||p')
          arch=$(build/mc-${{ matrix.target }}.exe --host | sed -n 's|^arch *||p')
          if [ "$os" != "windows" ] || [ "$arch" != "${{ matrix.larch }}" ]; then
            echo "::error::the binary says it is hosted on '$os/$arch', not windows/${{ matrix.larch }}"
            exit 1
          fi

      # The release gate: the binary being shipped compiles itself to a fixed
      # point on this machine and then runs the whole suite. It is the Windows
      # equivalent of the macOS job's `scripts/test.sh dist/mc`, and stronger.
      # TMPDIR in D:/a/_temp form and the architecture stated, for the same
      # reasons the CI host jobs give (docs/guide/95-windows-host.md).
      - name: Bootstrap to a fixed point with the binary being shipped
        shell: bash
        run: |
          export TMPDIR="$(cygpath -m "$RUNNER_TEMP")"
          scripts/bootstrap-windows.sh --arch ${{ matrix.larch }} build/mc-${{ matrix.target }}.exe

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          scripts/release-assets.sh "$VERSION" "$TARGET" "build/mc-$TARGET.exe" dist
          ls -l dist

      - name: Upload the packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/mc-*.tar.gz
            dist/mc-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    # Five tarballs: the macOS one from `build`, the two Linux ones from
    # `build-linux`, the two Windows ones from `build-windows`.
    # `download-artifact` below globs `release-*`, so all three producers have
    # to be finished.
    needs: [build, build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Collect the built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # The release body is the tag's own annotation -- autotag.yml writes the
      # pull request's title and number into it, tag.yml writes the notes the
      # operator typed -- plus the checksums of everything being attached.
      - name: Compose the release body
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag" || true
          annotation=$(git tag -l --format='%(contents)' "$tag")
          {
            if [ -n "$annotation" ]; then
              printf '%s\n' "$annotation"
            else
              echo "mc $version"
            fi
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "# macOS (arm64)"
            echo "tar xzf mc-$version-macos-arm64.tar.gz"
            echo "cd mc-$version-macos-arm64"
            echo "xattr -d com.apple.quarantine mc     # ad-hoc signed, not notarized"
            echo "install -m 755 mc /usr/local/bin/mc"
            echo
            echo "# Linux (arm64 or x86_64), statically linked against musl"
            echo "tar xzf mc-$version-linux-arm64.tar.gz"
            echo "install -m 755 mc-$version-linux-arm64/mc /usr/local/bin/mc"
            echo
            echo "# Windows (arm64 or x86_64), kernel32 only, no C runtime"
            echo "tar xzf mc-$version-windows-arm64.tar.gz"
            printf '%s\n' "copy mc-$version-windows-arm64\\mc.exe C:\\tools\\mc.exe"
            echo '```'
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # A version with a `-` suffix (0.2.0-rc1) is a pre-release. Neither
          # autotag.yml nor tag.yml makes such a tag -- the project has no
          # pre-releases (docs/ci.md § Versioning) -- but a hand-pushed one
          # still publishes correctly.
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "mc $VERSION" \
            --notes-file "$RUNNER_TEMP/body.md" \
            --verify-tag \
            $prerelease \
            dist/mc-*.tar.gz dist/mc-*.tar.gz.sha256
