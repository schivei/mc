            timeout 60 qemu-system-riscv64 -machine virt -bios none -nographic \
                -kernel "$1" < /dev/null > out.txt 2> err.txt
            echo $?
          }
          st=$(run kernel/kernel.bin)
          echo "--- transcript ---"
          cat out.txt
          echo "--- exit $st ---"
          if [ "$st" = "124" ]; then echo "::error::the kernel hung"; exit 1; fi
          expected=$(printf 'boot\ntrap\nt0 t1 t0 t1 t0 t1 t0 t1 t0 t1 \nok')
          if [ "$(cat out.txt)" != "$expected" ]; then
            echo "::error::wrong transcript"; exit 1
          fi
          if [ "$st" != "0" ]; then echo "::error::exit $st, expected 0"; exit 1; fi
          st=$(run kernel/kernel42.bin)
          if [ "$st" != "42" ]; then echo "::error::exit $st, expected 42"; exit 1; fi
          echo "ok: transcript, exit 0, and halt(42) -> exit 42"

  # M40: the runtime oracle for examples/avr, and there are TWO of them because
  # neither is enough on its own -- simavr gives a process exit code through the
  # .mmcu command register and no board does, `qemu-system-avr` gives the UART
  # transcript a real Arduino Uno would give and has no exit device. Ubuntu
  # carries both (`simavr` in universe, `qemu-system-avr` in qemu-system-misc,
  # the same package the RISC-V job already installs). Nothing is compiled here:
  # the four images travel as an artifact from the macOS job.
  #
  # The apt package is simavr 1.6, which is NOT the simavr a developer installs
  # by hand (Homebrew builds master): it writes the firmware's transcript to
  # stderr with the newline rendered as a trailing `.`, and its command enum has
  # no exit code at all. So nothing here compares raw output. Every run goes
  # through `examples/avr/oracle/simavr-run.sh`, the same script
  # `examples/avr/test.sh` calls -- and `make check-avr` runs that script
  # against THIS version too, in Docker, so a green run here follows from a
  # green run there. See the script's header, and docs/specs/M40.md finding 11.
  baremetal-avr:
    name: Run the firmware (bare-metal avr)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      # for examples/avr/oracle/simavr-run.sh; the images themselves are the
      # artifact, nothing is compiled here
      - uses: actions/checkout@v4

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: avr-images
          path: avr

      - name: Install simavr and qemu-system-avr
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends simavr qemu-system-misc
          dpkg-query -W -f '${Package} ${Version}\n' simavr
          qemu-system-avr --version | head -1

      # The exact transcript and the verdict the firmware halted with. On this
      # simavr the verdict is the byte the firmware wrote to the .mmcu command
      # register (0x04 for halt(0), 0x05 for halt(1)), because 1.6 answers that
      # register with `has no handler` and exits 0 whatever was asked; where the
      # command IS implemented -- a developer's simavr -- the script requires
      # the process status to match as well. It also fails on any `Invalid
      # read`/`Invalid write`/`avr_sadly_crashed` line, which is the class of
      # failure that used to show up here as a fifteen minute hang.
      - name: simavr -- the transcript and the verdict
        run: |
          set -u
          T=$(printf 'boot\nblink\ntick\nsum 352\nok')
          bad=0
          sh examples/avr/oracle/simavr-run.sh simavr avr/avr.elf work/a exact "$T" 0 || bad=1
          echo "--- transcript ---"; cat work/a/transcript
          sh examples/avr/oracle/simavr-run.sh simavr avr/avr1.elf work/b exact "$T" 1 || bad=1
          if [ "$bad" != "0" ]; then echo "::error::the simavr oracle disagreed"; exit 1; fi

      # The two sweeps check their own answers on the device: 40 of them, over
      # every task of the machine. A wrong encoding usually still assembles.
      - name: simavr -- the two on-device sweeps
        run: |
          set -u
          bad=0
          for s in sweep_a sweep_b; do
            sh examples/avr/oracle/simavr-run.sh simavr "avr/$s.elf" "work/$s" sweep "$s" || bad=1
            cat "work/$s/transcript"
          done
          if [ "$bad" != "0" ]; then echo "::error::a sweep disagreed"; exit 1; fi

      # qemu-system-avr, the second oracle: the same five lines out of UART0 on
      # an independent model of the part. An arduino-uno has no exit device, so
      # the run is ENDED by the timeout and 124 is the expected status here --
      # what is asserted is the transcript.
      - name: qemu-system-avr -- the same transcript on UART0
        run: |
          set -u
          timeout 30 qemu-system-avr -machine arduino-uno -bios avr/avr.elf -nographic \
              < /dev/null > out.txt 2> err.txt
          st=$?
          echo "--- transcript ---"; cat out.txt; echo "--- exit $st ---"
          expected=$(printf 'boot\nblink\ntick\nsum 352\nok')
          if [ "$(cat out.txt)" != "$expected" ]; then
            echo "::error::wrong transcript on UART0"; cat err.txt; exit 1
          fi
          echo "ok: the same transcript on a second simulator"

  docs-updated:
    name: Docs updated
    # Owner's rule (2026-09-04): every PR that changes the compiler, the libraries or the
    # examples must also update docs/ (the site is regenerated from docs/ on merge).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Compare changed paths against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import yaml

          base = os.environ["BASE"]
          head = os.environ["HEAD"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          print("\n".join(changed))

          cfg = yaml.safe_load("""
          watched:
            - src/
            - lib/
            - examples/
            - stage0/
            - tools/
          docs: docs/
          """)

          touched_watched = any(
              any(path.startswith(prefix) for prefix in cfg["watched"])
              for path in changed
          )
          touched_docs = any(path.startswith(cfg["docs"]) for path in changed)

          if touched_watched and not touched_docs:
              print(
                  "::error::this PR changes src/, lib/, examples/, stage0/ or tools/ "
                  "but nothing under docs/ -- update the guide, the reference or the "
                  "example pages (the site is generated from docs/)"
              )
              sys.exit(1)

          print("ok: docs gate satisfied")
          PY
