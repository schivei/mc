        continue-on-error: true
        run: |
          set +e
          echo "host-arch: $(sh scripts/host-arch.sh)  uname -m: $(uname -m)  PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE PROCESSOR_ARCHITEW6432=$PROCESSOR_ARCHITEW6432"
          build/mc-windows-arm64.exe tests/001-return42.mc -o build/smoke-small.obj; echo "small compile: exit $?"
          build/mc-windows-arm64.exe --dump-tokens src/mc_windows.mc | tail -1; echo "lex src: exit ${PIPESTATUS[0]}"
          build/mc-windows-arm64.exe --dump-ast src/mc_windows.mc | tail -1; echo "parse src: exit ${PIPESTATUS[0]}"
