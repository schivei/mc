  # M39: the runtime oracle for examples/kernel. GitHub has no bare-metal
  # RISC-V runner and there is no need for one -- QEMU's `virt` board IS the
  # contract this milestone was written against, and `ubuntu-latest` carries it
  # in `qemu-system-misc`. Nothing is compiled here: the image travels as an
  # artifact from the macOS job, exactly like the Linux and Windows objects.
  baremetal-riscv64:
    name: Boot the kernel (bare-metal riscv64)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
