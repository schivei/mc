# CI — the repository's own `make check`, plus the half of the Linux suite that
# needs a Linux machine. See docs/ci.md for the design and the settings the
# repository owner has to enable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per pull request (or per branch, for the push to main); a new push
# cancels the previous run. The job names below are the required status checks
# on `main` -- "make check (macOS arm64)", "Link and run the suite
# (linux/arm64)", "Link and run the suite (linux/x86_64)", "Link and run the
# suite (windows/arm64)", "mc on linux/arm64 host", "mc on linux/x86_64 host"
# and, since M38, "mc on windows/arm64 host" and "mc on windows/x86_64 host" --
# so they must not be renamed without updating the branch protection
# (docs/ci.md § Branch protection).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Everything the project can prove on its own machine. `mc` only builds and
  # runs on macOS arm64 today (docs/plan.md § Phase 2), so this is the job that
  # compiles anything.
  check:
    name: make check (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Nothing is installed on this runner. `make check` runs `test-linux`,
      # which the Makefile already guards: with no ld.lld it prints
      # "SKIPPED (ld.lld not in PATH)", with no Docker "SKIPPED (docker is not
      # running)". GitHub's macOS runners have neither, so it skips and the
      # build stays green; the Linux suite runs for real in the job below, and
      # the half that happens here -- cross-compiling to ELF -- needs no linker.
      - name: Toolchain facts
        run: |
          sw_vers
          uname -m
          clang --version | head -1
          ld -v 2>&1 | head -1 || true
          if docker info >/dev/null 2>&1; then
            echo "docker: running"
          else
            echo "docker: absent -- make check's test-linux target self-skips"
          fi

      # budget, test, check-lex, check-ast, check-bundle, check-asm, check-obj,
      # bootstrap (fixed point + golden), check-surface, test-exe, check-mc,
      # check-standalone, check-toml, check-build, test-linux (skipped here),
      # check-examples.
      - name: make check
        run: make check

      # The half of the Linux suite that runs here: cross-compile every test to
      # an ELF64 object with the `elf-obj` backend. No ld.lld, no Docker and no
      # sysroot are involved -- the linking and the running happen on the
      # linux-arm64 job below, which is where a linux/arm64 CPU is.
      - name: Cross-compile the suite for linux/arm64
        run: scripts/test-linux.sh --build-only build/linux-objs build/mc1

      # The same for linux/x86_64 (M17 step B): the `elf-obj-x86_64` backend
      # over the x86-64 machine. Still no linker and no Docker here -- the
      # linking and the running happen on the ubuntu-latest job below.
      - name: Cross-compile the suite for linux/x86_64
        run: scripts/test-linux.sh --arch x86_64 --build-only build/linux-objs-x86_64 build/mc1

      # M37: `mc` hosted on Linux. What is cross-built HERE is the two ELF
      # OBJECTS, not the executables: `kind = "obj"` in the two `*-obj.toml`
      # configs makes the driver compile and return, so no [linker], no musl
      # sysroot and no `ld.lld` take part -- which is the point, because this
      # runner has none of them. The sysroot is four musl files copied out of
      # an `alpine:3` container by scripts/sysroot-linux.sh, and GitHub's macOS
      # runners have no Docker to run that container in; there is no Homebrew
      # formula that ships those files either. So the split is the same one the
      # test suite above already uses: compile on macOS, link and run on the
      # Linux runner, which has its distribution's own musl (`apt-get install
      # musl-dev`) and its own lld.
      - name: Cross-compile mc for linux/arm64 and linux/x86_64
        run: |
          set -eu
          make mc-linux-obj
          make mc-linux-x86_64-obj
          ls -l build/mc-linux-arm64.o build/mc-linux-x86_64.o
          for obj in build/mc-linux-arm64.o build/mc-linux-x86_64.o; do
            [ -s "$obj" ] || { echo "::error::$obj was not produced"; exit 1; }
          done
          # A wrong machine here would only surface on the Linux runner, far
          # from its cause. `file` is not essential, so its absence is not a
          # failure -- a missing object above already is.
          if command -v file >/dev/null 2>&1; then
            file build/mc-linux-arm64.o build/mc-linux-x86_64.o
            file build/mc-linux-arm64.o  | grep -q 'ELF 64-bit.*aarch64'
            file build/mc-linux-x86_64.o | grep -q 'ELF 64-bit.*x86-64'
          fi

      # M38: `mc` hosted on Windows. Same split, same reason as the Linux pair
      # above: what is cross-built HERE is the two COFF OBJECTS plus the two
      # objects every Windows link line carries (winstart.obj, the entry point,
      # and mcrt.obj, the POSIX shims over kernel32) and the kernel32 import
      # library. The Windows runners have lld-link and no `mc` at all, so they
      # could not produce any of it: the compiler they link IS the artifact.
      - name: Cross-compile mc for the Windows hosts
        run: |
          set -eu
          make mc-windows-obj
          make mc-windows-x86_64-obj
          make mcrt-windows
          make mcrt-windows-x86_64
          ls -l build/mc-windows-arm64.obj build/mc-windows-x86_64.obj
          ls -l build/sysroot/windows-aarch64 build/sysroot/windows-x86_64
          for f in build/mc-windows-arm64.obj build/mc-windows-x86_64.obj \
                   build/sysroot/windows-aarch64/winstart.obj \
                   build/sysroot/windows-aarch64/mcrt.obj \
                   build/sysroot/windows-x86_64/winstart.obj \
                   build/sysroot/windows-x86_64/mcrt.obj; do
            [ -s "$f" ] || { echo "::error::$f was not produced"; exit 1; }
          done
          # kernel32.lib needs llvm-dlltool, which this runner may not have (the
          # suite step above has the same caveat): when it is absent here,
          # scripts/link-windows.sh regenerates it on the Windows runner, where
          # the LLVM install carries the tool.
          for a in aarch64 x86_64; do
            [ -s "build/sysroot/windows-$a/kernel32.lib" ] \
              || echo "::notice::build/sysroot/windows-$a/kernel32.lib absent (no llvm-dlltool here); the Windows runner regenerates it"
          done
          # A wrong machine here would only surface on the Windows runner, far
          # from its cause.
          if command -v llvm-readobj >/dev/null 2>&1; then
            llvm-readobj --file-headers build/mc-windows-arm64.obj  | grep -q IMAGE_FILE_MACHINE_ARM64
            llvm-readobj --file-headers build/mc-windows-x86_64.obj | grep -q IMAGE_FILE_MACHINE_AMD64
          fi

      # M19: the same for windows/aarch64 -- the `coff-obj-arm64` backend over
      # the same arm64 machine. This step also produces winrt.obj (the compiled
      # lib/sys_windows.mc) and kernel32.lib, the two files the Windows half has
      # no way to make for itself; without llvm-dlltool here the import library
      # is simply missing from the artifact and the Windows job rebuilds it.
      - name: Cross-compile the suite for windows/arm64
        run: scripts/test-windows.sh --build-only build/windows-objs build/mc1

      # M20: the same for windows/x86_64 -- the `coff-obj-x86_64` backend over
      # the Win64 half of the x86-64 machine. Its own winrt.obj, winstart.obj
      # and kernel32.lib travel with it: nothing is shared with the ARM64 set.
      - name: Cross-compile the suite for windows/x86_64
        run: scripts/test-windows.sh --arch x86_64 --build-only build/windows-objs-x86_64 build/mc1

      # M25: the two musl sysroots the linux/* suite jobs link against, fetched
      # by `mc` itself from the pinned rows of src/sysroots.mc -- checksum
      # verified by the compiler's own SHA-256, no apt and no Docker. This is
      # the job that HAS an `mc`; the two suite jobs are --run-only (ld.lld and
      # a sysroot, no compiler at all), which is why the fetch happens here and
      # travels as an artifact. The cache key is the table, so a moved pin
      # invalidates it (docs/reference/sysroot.md § 8).
      - name: Cache the fetched musl sysroots
        uses: actions/cache@v4
        with:
          path: |
            build/sysroot/linux-aarch64
            build/sysroot/linux-x86_64
          key: musl-sysroot-${{ hashFiles('src/sysroots.mc') }}

      - name: Fetch the musl sysroots with mc sysroot fetch
        run: |
          for a in aarch64 x86_64; do
            if [ ! -f "build/sysroot/linux-$a/libc.a" ]; then
              build/mc1 sysroot fetch "linux-$a" --yes --sysroot-dir "build/sysroot/linux-$a"
            fi
            build/mc1 sysroot path "linux-$a" --sysroot-dir "build/sysroot/linux-$a"
          done

      - name: Upload the fetched musl sysroot (aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: musl-sysroot-aarch64
          path: build/sysroot/linux-aarch64
          if-no-files-found: error
          retention-days: 7

      - name: Upload the fetched musl sysroot (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: musl-sysroot-x86_64
          path: build/sysroot/linux-x86_64
          if-no-files-found: error
          retention-days: 7

      - name: Upload the self-hosted compiler
        uses: actions/upload-artifact@v4
        with:
          name: mc-macos-arm64
          path: build/mc-exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the reference object of the macOS bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: mc2-macos-arm64
          path: build/mc2.o
          if-no-files-found: error
          retention-days: 7

      # The two objects the Linux host jobs link. Named for what they become,
      # not for what they are: `mc-linux-hosts` holds the compiler for each
      # Linux host, one `ld.lld` invocation short of being runnable.
      - name: Upload the cross-built Linux compilers
        uses: actions/upload-artifact@v4
        with:
          name: mc-linux-hosts
          path: |
            build/mc-linux-arm64.o
            build/mc-linux-x86_64.o
          if-no-files-found: error
          retention-days: 14

      # The two objects the Windows host jobs link, plus everything else those
      # links need. Named for what they become, not for what they are.
      - name: Upload the cross-built Windows compilers
        uses: actions/upload-artifact@v4
        with:
          name: mc-windows-hosts
          path: |
            build/mc-windows-arm64.obj
            build/mc-windows-x86_64.obj
            build/sysroot/windows-aarch64
            build/sysroot/windows-x86_64
          if-no-files-found: error
          retention-days: 14

      - name: Upload the cross-built linux/arm64 objects
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-objects
          path: build/linux-objs
          if-no-files-found: error
          retention-days: 7

      - name: Upload the cross-built linux/x86_64 objects
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-objects
          path: build/linux-objs-x86_64
          if-no-files-found: error
          retention-days: 7

      - name: Upload the cross-built windows/arm64 objects
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-objects
          path: build/windows-objs
          if-no-files-found: error
          retention-days: 7

      - name: Upload the cross-built windows/x86_64 objects
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-objects
          path: build/windows-objs-x86_64
          if-no-files-found: error
          retention-days: 7

  # The other half: link the objects against musl and run them on a real
  # linux/arm64 CPU. Nothing here compiles mc code, so no macOS toolchain and no
  # `mc` binary are needed.
  linux-arm64:
    name: Link and run the suite (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: check
    timeout-minutes: 30
    steps:
      - name: Check out
        # The tests are run from the repository root: 025-linecount opens its
        # own source by a relative path.
        uses: actions/checkout@v4

      - name: Download the cross-built objects
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-objects
          path: build/linux-objs

      - name: Install ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          if ! command -v ld.lld >/dev/null 2>&1; then
            # Debian ships ld.lld under the versioned llvm prefix on some
            # releases; either shape is fine, it just has to be on PATH.
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version

      # M25: the sysroot is the four musl files `mc sysroot fetch` pulled from
      # the pinned Alpine row in the `check` job and verified with mc's own
      # SHA-256 (docs/reference/sysroot.md § 7). It used to be `apk add
      # musl-dev` in a container here, with an apt fallback; neither Docker nor
      # apt is involved any more, and what the suite links against is exactly
      # what a user gets from one command.
      - name: Download the fetched musl sysroot
        uses: actions/download-artifact@v4
        with:
          name: musl-sysroot-aarch64
          path: build/sysroot/linux-aarch64

      - name: Link with ld.lld and run natively
        run: scripts/test-linux.sh --run-only build/linux-objs

  # M17 step B: the x86-64 half. Same shape as linux-arm64, on the x86-64
  # runner, with the amd64 musl sysroot. docs/plan.md § Rule for every new
  # target: an architecture is not supported until a job links and RUNS its
  # suite on real hardware of that architecture.
  linux-x86_64:
    name: Link and run the suite (linux/x86_64)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - name: Check out
        # The tests are run from the repository root: 025-linecount opens its
        # own source by a relative path.
        uses: actions/checkout@v4

      - name: Download the cross-built objects
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-objects
          path: build/linux-objs-x86_64

      - name: Install ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          if ! command -v ld.lld >/dev/null 2>&1; then
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version

      # M25: as in linux-arm64 -- fetched once by `mc sysroot fetch` in the
      # `check` job, checksum verified there, and carried here as an artifact.
      - name: Download the fetched musl sysroot
        uses: actions/download-artifact@v4
        with:
          name: musl-sysroot-x86_64
          path: build/sysroot/linux-x86_64

      - name: Link with ld.lld and run natively
        run: scripts/test-linux.sh --arch x86_64 --run-only build/linux-objs-x86_64

  # M37: `mc` HOSTED on Linux. Not "a Linux target built from macOS" -- the
  # object downloaded here is the compiler; this job links it and it compiles
  # itself to a fixed point on this machine before anything else runs. See
  # docs/guide/90-linux-host.md.
  linux-arm64-host:
    name: mc on linux/arm64 host
    runs-on: ubuntu-24.04-arm
    needs: check
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the cross-compiled Linux objects
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-hosts
          path: build

      - name: Download the macOS reference object
        uses: actions/download-artifact@v4
        with:
          name: mc2-macos-arm64
          path: build

      - name: Install ld.lld and the musl development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld musl-dev musl-tools
          if ! command -v ld.lld >/dev/null 2>&1; then
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version
          ls -l /usr/lib/aarch64-linux-musl/crt1.o /usr/lib/aarch64-linux-musl/libc.a

      # The half the macOS runner could not do. With the four musl files already
      # in MC_SYSROOT, scripts/link-linux.sh runs `ld.lld` and nothing else --
      # it only calls scripts/sysroot-linux.sh (and therefore Docker) when one
      # of them is missing.
      - name: Link the cross-compiled object into the Linux compiler
        env:
          MC_SYSROOT: /usr/lib/aarch64-linux-musl
        run: |
          set -eu
          scripts/link-linux.sh build/mc-linux-arm64 build/mc-linux-arm64.o
          chmod 755 build/mc-linux-arm64
          ls -l build/mc-linux-arm64

      - name: What this binary says it is
        run: |
          chmod 755 build/mc-linux-arm64
          build/mc-linux-arm64 --host

      # MC_SYSROOT points at the distribution's own musl files, so nothing is
      # downloaded and no container is started: scripts/link-linux.sh and
      # scripts/test-linux.sh both read it.
      - name: Bootstrap and run the Linux make check subset
        env:
          MC_SYSROOT: /usr/lib/aarch64-linux-musl
        run: make check SEED=build/mc-linux-arm64

      # The proof that a Linux-hosted mc is the SAME compiler: the Mach-O object
      # it writes for src/mc.mc is byte for byte the one the macOS job wrote for
      # itself (build/mc2.o, uploaded above).
      - name: Cross proof against the macOS object
        run: |
          set -eu
          build/mc2l --backend=macho src/mc.mc -o build/x-cross.o
          cmp build/x-cross.o build/mc2.o
          echo "ok: the Mach-O object written on linux/arm64 is the one macOS writes"

  # M37: `mc` HOSTED on Linux. Not "a Linux target built from macOS" -- the
  # object downloaded here is the compiler; this job links it and it compiles
  # itself to a fixed point on this machine before anything else runs. See
  # docs/guide/90-linux-host.md.
  linux-x86-64-host:
    name: mc on linux/x86_64 host
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the cross-compiled Linux objects
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-hosts
          path: build

      - name: Download the macOS reference object
        uses: actions/download-artifact@v4
        with:
          name: mc2-macos-arm64
          path: build

      - name: Install ld.lld and the musl development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld musl-dev musl-tools
          if ! command -v ld.lld >/dev/null 2>&1; then
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version
          ls -l /usr/lib/x86_64-linux-musl/crt1.o /usr/lib/x86_64-linux-musl/libc.a

      # The half the macOS runner could not do. With the four musl files already
      # in MC_SYSROOT, scripts/link-linux.sh runs `ld.lld` and nothing else --
      # it only calls scripts/sysroot-linux.sh (and therefore Docker) when one
      # of them is missing.
      - name: Link the cross-compiled object into the Linux compiler
        env:
          MC_SYSROOT: /usr/lib/x86_64-linux-musl
        run: |
          set -eu
          scripts/link-linux.sh --arch x86_64 build/mc-linux-x86_64 build/mc-linux-x86_64.o
          chmod 755 build/mc-linux-x86_64
          ls -l build/mc-linux-x86_64

      - name: What this binary says it is
        run: |
          chmod 755 build/mc-linux-x86_64
          build/mc-linux-x86_64 --host

      # MC_SYSROOT points at the distribution's own musl files, so nothing is
      # downloaded and no container is started: scripts/link-linux.sh and
      # scripts/test-linux.sh both read it.
      - name: Bootstrap and run the Linux make check subset
        env:
          MC_SYSROOT: /usr/lib/x86_64-linux-musl
        run: make check SEED=build/mc-linux-x86_64

      # The proof that a Linux-hosted mc is the SAME compiler: the Mach-O object
      # it writes for src/mc.mc is byte for byte the one the macOS job wrote for
      # itself (build/mc2.o, uploaded above).
      - name: Cross proof against the macOS object
        run: |
          set -eu
          build/mc2l --backend=macho src/mc.mc -o build/x-cross.o
          cmp build/x-cross.o build/mc2.o
          echo "ok: the Mach-O object written on linux/x86_64 is the one macOS writes"

  # M19: the Windows half. Nothing here compiles mc code either -- the objects,
  # the compiled system layer (winrt.obj) and the kernel32 import library all
  # travel in the artifact, so this job needs a linker and nothing else.
  # docs/plan.md § Rule for every new target: a target is not supported until a
  # job links and RUNS its suite on real hardware of that architecture.
  windows-arm64:
    name: Link and run the suite (windows/arm64)
    runs-on: windows-11-arm
    needs: check
    timeout-minutes: 30
    env:
      LLVM_VERSION: "20.1.8"
    steps:
      - name: Check out
        # The tests are run from the repository root: 025-linecount opens its
        # own source by a relative path.
        uses: actions/checkout@v4

      - name: Download the cross-built objects
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-objects
          path: build/windows-objs

      # Facts first: the runner image may already carry LLVM, in which case
      # nothing has to be downloaded at all. This step never fails -- it only
      # reports, and sets `found` for the step below.
      - name: Tool facts
        id: tools
        shell: bash
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          if where lld-link 2>/dev/null; then
            echo "found=1" >> "$GITHUB_OUTPUT"
          elif [ -x "/c/Program Files/LLVM/bin/lld-link.exe" ]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "lld-link: absent -- the next step downloads LLVM $LLVM_VERSION"
            echo "found=0" >> "$GITHUB_OUTPUT"
          fi
          where clang 2>/dev/null || echo "clang: absent (not needed)"

      - name: Cache the LLVM toolchain
        if: steps.tools.outputs.found != '1'
        uses: actions/cache@v4
        with:
          path: build/llvm
          key: llvm-woa64-${{ env.LLVM_VERSION }}

      # The Windows-on-ARM release of LLVM. Two shapes have shipped over the
      # years -- a tarball and an NSIS installer -- so both are tried, and the
      # step fails loudly rather than letting the suite skip itself: this job is
      # the only place a Windows binary is ever executed.
      - name: Obtain lld-link
        if: steps.tools.outputs.found != '1'
        shell: bash
        run: |
          set -e
          if [ ! -x build/llvm/bin/lld-link.exe ]; then
            mkdir -p build/llvm
            base="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION"
            if curl -fSL -o /tmp/llvm.tar.xz "$base/clang+llvm-$LLVM_VERSION-aarch64-pc-windows-msvc.tar.xz"; then
              tar -xf /tmp/llvm.tar.xz -C build/llvm --strip-components=1
            else
              curl -fSL -o /tmp/llvm.exe "$base/LLVM-$LLVM_VERSION-woa64.exe"
              7z x -obuild/llvm /tmp/llvm.exe > /dev/null
            fi
          fi
          echo "$PWD/build/llvm/bin" >> "$GITHUB_PATH"
          build/llvm/bin/lld-link.exe --version || true

      - name: Link with lld-link and run natively
        shell: bash
        run: scripts/test-windows.sh --run-only build/windows-objs

  # M20: the x64 half of the same story. The runner ships LLVM under
