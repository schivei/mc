          ls -l build/smoke-small.obj build/smoke-big.obj 2>/dev/null || true

      # Two things the native mc needs from the shell around it: a temporary
      # directory it can open (with MSYS2_ARG_CONV_EXCL set, `mktemp -d` hands
      # the check scripts /tmp/..., a path only MSYS understands -- so TMPDIR is
      # the runner's own temp in D:/a/_temp form, which both sides accept), and
