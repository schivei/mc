# CI — the repository's own `make check`, plus the half of the Linux suite that
# needs a Linux machine. See docs/ci.md for the design and the settings the
# repository owner has to enable.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per pull request (or per branch, for the push to main); a new push
# cancels the previous run. The job names below are the required status checks
# on `main` -- "make check (macOS arm64)", "Link and run the suite
# (linux/arm64)" and, since M37, "mc on linux/arm64 host" and "mc on
# linux/x86_64 host" -- so they must not be renamed without updating the branch
# protection (docs/ci.md § Branch protection).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Everything the project can prove on its own machine. `mc` only builds and
  # runs on macOS arm64 today (docs/plan.md § Phase 2), so this is the job that
  # compiles anything.
  check:
    name: make check (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Nothing is installed on this runner. `make check` runs `test-linux`,
      # which the Makefile already guards: with no ld.lld it prints
      # "SKIPPED (ld.lld not in PATH)", with no Docker "SKIPPED (docker is not
      # running)". GitHub's macOS runners have neither, so it skips and the
      # build stays green; the Linux suite runs for real in the job below, and
      # the half that happens here -- cross-compiling to ELF -- needs no linker.
      - name: Toolchain facts
        run: |
          sw_vers
          uname -m
          clang --version | head -1
          ld -v 2>&1 | head -1 || true
          if docker info >/dev/null 2>&1; then
            echo "docker: running"
          else
            echo "docker: absent -- make check's test-linux target self-skips"
          fi

      # budget, test, check-lex, check-ast, check-bundle, check-asm, check-obj,
      # bootstrap (fixed point + golden), check-surface, test-exe, check-mc,
      # check-standalone, check-toml, check-build, test-linux (skipped here),
      # check-examples.
      - name: make check
        run: make check

      # The half of the Linux suite that runs here: cross-compile every test to
      # an ELF64 object with the `elf-obj` backend. No ld.lld, no Docker and no
      # sysroot are involved -- the linking and the running happen on the
      # linux-arm64 job below, which is where a linux/arm64 CPU is.
      - name: Cross-compile the suite for linux/arm64
        run: scripts/test-linux.sh --build-only build/linux-objs build/mc1

      # The same for linux/x86_64 (M17 step B): the `elf-obj-x86_64` backend
      # over the x86-64 machine. Still no linker and no Docker here -- the
      # linking and the running happen on the ubuntu-latest job below.
      - name: Cross-compile the suite for linux/x86_64
        run: scripts/test-linux.sh --arch x86_64 --build-only build/linux-objs-x86_64 build/mc1

      # M37: `mc` hosted on Linux. The two binaries are CROSS-BUILT here -- the
      # ELF writers and the two machines are the same compiler -- and the jobs
      # below run them on real Linux CPUs: bootstrap to a fixed point and the
      # Linux `make check` subset. ld.lld and the musl sysroot are the only
      # extra ingredients, and Homebrew has both (the sysroot needs Docker,
      # which these runners do not have, so it comes from `brew install musl`
      # when it is there and the job self-skips otherwise).
      - name: Cross-build mc for linux/arm64 and linux/x86_64
        run: |
          set -eu
          if ! command -v ld.lld >/dev/null 2>&1; then
            brew install lld || true
            for cand in /opt/homebrew/opt/lld/bin/ld.lld /usr/local/opt/lld/bin/ld.lld; do
              [ -x "$cand" ] && sudo ln -sf "$cand" /usr/local/bin/ld.lld && break
            done
          fi
          ld.lld --version
          make sysroot-linux
          make sysroot-linux-x86_64
          build/mc1 build src --config src/mc.linux-aarch64.toml
          build/mc1 build src --config src/mc.linux-x86_64.toml
          ls -l build/mc-linux-arm64 build/mc-linux-x86_64
          file build/mc-linux-arm64 build/mc-linux-x86_64 || true

      - name: Upload the self-hosted compiler
        uses: actions/upload-artifact@v4
        with:
          name: mc-macos-arm64
          path: build/mc-exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload the reference object of the macOS bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: mc2-macos-arm64
          path: build/mc2.o
          if-no-files-found: error
          retention-days: 7

      - name: Upload the cross-built Linux compilers
        uses: actions/upload-artifact@v4
        with:
          name: mc-linux-hosts
          path: |
            build/mc-linux-arm64
            build/mc-linux-x86_64
          if-no-files-found: error
          retention-days: 14

      - name: Upload the cross-built linux/arm64 objects
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-objects
          path: build/linux-objs
          if-no-files-found: error
          retention-days: 7

      - name: Upload the cross-built linux/x86_64 objects
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-objects
          path: build/linux-objs-x86_64
          if-no-files-found: error
          retention-days: 7

  # The other half: link the objects against musl and run them on a real
  # linux/arm64 CPU. Nothing here compiles mc code, so no macOS toolchain and no
  # `mc` binary are needed.
  linux-arm64:
    name: Link and run the suite (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: check
    timeout-minutes: 30
    steps:
      - name: Check out
        # The tests are run from the repository root: 025-linecount opens its
        # own source by a relative path.
        uses: actions/checkout@v4

      - name: Download the cross-built objects
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-objects
          path: build/linux-objs

      - name: Install ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          if ! command -v ld.lld >/dev/null 2>&1; then
            # Debian ships ld.lld under the versioned llvm prefix on some
            # releases; either shape is fine, it just has to be on PATH.
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version

      # The sysroot is four files (crt1.o crti.o crtn.o libc.a) copied out of an
      # Alpine container. Cached, and the script is itself a cache: with the four
      # files present it does nothing.
      - name: Cache the musl sysroot
        uses: actions/cache@v4
        with:
          path: build/sysroot/linux-aarch64
          key: musl-sysroot-aarch64-${{ hashFiles('scripts/sysroot-linux.sh') }}

      - name: Populate the musl sysroot
        run: |
          if scripts/sysroot-linux.sh build/sysroot/linux-aarch64; then
            exit 0
          fi
          # Fallback when Docker is unavailable on the runner: Debian's own
          # aarch64 musl development files are the same four objects.
          echo "sysroot: falling back to apt musl-dev"
          sudo apt-get install -y --no-install-recommends musl-dev musl-tools
          mkdir -p build/sysroot/linux-aarch64
          cp /usr/lib/aarch64-linux-musl/crt1.o \
             /usr/lib/aarch64-linux-musl/crti.o \
             /usr/lib/aarch64-linux-musl/crtn.o \
             /usr/lib/aarch64-linux-musl/libc.a \
             build/sysroot/linux-aarch64/

      - name: Link with ld.lld and run natively
        run: scripts/test-linux.sh --run-only build/linux-objs

  # M17 step B: the x86-64 half. Same shape as linux-arm64, on the x86-64
  # runner, with the amd64 musl sysroot. docs/plan.md § Rule for every new
  # target: an architecture is not supported until a job links and RUNS its
  # suite on real hardware of that architecture.
  linux-x86_64:
    name: Link and run the suite (linux/x86_64)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - name: Check out
        # The tests are run from the repository root: 025-linecount opens its
        # own source by a relative path.
        uses: actions/checkout@v4

      - name: Download the cross-built objects
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-objects
          path: build/linux-objs-x86_64

      - name: Install ld.lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
          if ! command -v ld.lld >/dev/null 2>&1; then
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version

      - name: Cache the musl sysroot
        uses: actions/cache@v4
        with:
          path: build/sysroot/linux-x86_64
          key: musl-sysroot-x86_64-${{ hashFiles('scripts/sysroot-linux.sh') }}

      - name: Populate the musl sysroot
        run: |
          if scripts/sysroot-linux.sh --arch x86_64 build/sysroot/linux-x86_64; then
            exit 0
          fi
          # Fallback when Docker is unavailable on the runner: Debian's own
          # x86-64 musl development files are the same four objects.
          echo "sysroot: falling back to apt musl-dev"
          sudo apt-get install -y --no-install-recommends musl-dev musl-tools
          mkdir -p build/sysroot/linux-x86_64
          cp /usr/lib/x86_64-linux-musl/crt1.o \
             /usr/lib/x86_64-linux-musl/crti.o \
             /usr/lib/x86_64-linux-musl/crtn.o \
             /usr/lib/x86_64-linux-musl/libc.a \
             build/sysroot/linux-x86_64/

      - name: Link with ld.lld and run natively
        run: scripts/test-linux.sh --arch x86_64 --run-only build/linux-objs-x86_64

  # M37: `mc` HOSTED on Linux. Not "a Linux target built from macOS" -- the
  # binary downloaded here is the compiler, and it compiles itself to a fixed
  # point on this machine before anything else runs. See
  # docs/guide/90-linux-host.md.
  linux-arm64-host:
    name: mc on linux/arm64 host
    runs-on: ubuntu-24.04-arm
    needs: check
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the cross-built Linux compilers
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-hosts
          path: build

      - name: Download the macOS reference object
        uses: actions/download-artifact@v4
        with:
          name: mc2-macos-arm64
          path: build

      - name: Install ld.lld and the musl development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld musl-dev musl-tools
          if ! command -v ld.lld >/dev/null 2>&1; then
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version
          ls -l /usr/lib/aarch64-linux-musl/crt1.o /usr/lib/aarch64-linux-musl/libc.a

      - name: What this binary says it is
        run: |
          chmod 755 build/mc-linux-arm64
          build/mc-linux-arm64 --host

      # MC_SYSROOT points at the distribution's own musl files, so nothing is
      # downloaded and no container is started: scripts/link-linux.sh and
      # scripts/test-linux.sh both read it.
      - name: Bootstrap and run the Linux make check subset
        env:
          MC_SYSROOT: /usr/lib/aarch64-linux-musl
        run: make check SEED=build/mc-linux-arm64

      # The proof that a Linux-hosted mc is the SAME compiler: the Mach-O object
      # it writes for src/mc.mc is byte for byte the one the macOS job wrote for
      # itself (build/mc2.o, uploaded above).
      - name: Cross proof against the macOS object
        run: |
          set -eu
          build/mc2l src/mc.mc -o build/x-cross.o
          cmp build/x-cross.o build/mc2.o
          echo "ok: the Mach-O object written on linux/arm64 is the one macOS writes"

  # M37: `mc` HOSTED on Linux. Not "a Linux target built from macOS" -- the
  # binary downloaded here is the compiler, and it compiles itself to a fixed
  # point on this machine before anything else runs. See
  # docs/guide/90-linux-host.md.
  linux-x86-64-host:
    name: mc on linux/x86_64 host
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the cross-built Linux compilers
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-hosts
          path: build

      - name: Download the macOS reference object
        uses: actions/download-artifact@v4
        with:
          name: mc2-macos-arm64
          path: build

      - name: Install ld.lld and the musl development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld musl-dev musl-tools
          if ! command -v ld.lld >/dev/null 2>&1; then
            for cand in /usr/bin/ld.lld-* /usr/lib/llvm-*/bin/ld.lld; do
              if [ -x "$cand" ]; then
                sudo ln -sf "$cand" /usr/local/bin/ld.lld
                break
              fi
            done
          fi
          ld.lld --version
          ls -l /usr/lib/x86_64-linux-musl/crt1.o /usr/lib/x86_64-linux-musl/libc.a

      - name: What this binary says it is
        run: |
          chmod 755 build/mc-linux-x86_64
          build/mc-linux-x86_64 --host

      # MC_SYSROOT points at the distribution's own musl files, so nothing is
      # downloaded and no container is started: scripts/link-linux.sh and
      # scripts/test-linux.sh both read it.
      - name: Bootstrap and run the Linux make check subset
        env:
          MC_SYSROOT: /usr/lib/x86_64-linux-musl
        run: make check SEED=build/mc-linux-x86_64

      # The proof that a Linux-hosted mc is the SAME compiler: the Mach-O object
      # it writes for src/mc.mc is byte for byte the one the macOS job wrote for
      # itself (build/mc2.o, uploaded above).
      - name: Cross proof against the macOS object
        run: |
          set -eu
          build/mc2l src/mc.mc -o build/x-cross.o
          cmp build/x-cross.o build/mc2.o
          echo "ok: the Mach-O object written on linux/x86_64 is the one macOS writes"

  docs-updated:
    name: Docs updated
    # Owner's rule (2026-09-04): every PR that changes the compiler, the libraries or the
    # examples must also update docs/ (the site is regenerated from docs/ on merge).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Compare changed paths against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          import yaml

          base = os.environ["BASE"]
          head = os.environ["HEAD"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          ).splitlines()
          print("\n".join(changed))

          cfg = yaml.safe_load("""
          watched:
            - src/
            - lib/
            - examples/
            - stage0/
            - tools/
          docs: docs/
          """)

          touched_watched = any(
              any(path.startswith(prefix) for prefix in cfg["watched"])
              for path in changed
          )
          touched_docs = any(path.startswith(cfg["docs"]) for path in changed)

          if touched_watched and not touched_docs:
              print(
                  "::error::this PR changes src/, lib/, examples/, stage0/ or tools/ "
                  "but nothing under docs/ -- update the guide, the reference or the "
                  "example pages (the site is generated from docs/)"
              )
              sys.exit(1)

          print("ok: docs gate satisfied")
          PY
