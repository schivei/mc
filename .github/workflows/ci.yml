            exit 1
          fi

      # `make check` on a Windows host is the subset in the Makefile, and it
      # STARTS with scripts/bootstrap-windows.sh: seed -> mc1w -> mc2w -> mc3w,
      # cmp, the golden, --host, and the whole suite run with the compiler that
      # came out (the objects downloaded above, linked and executed here).
      # check-skipped prints one line per target that does not run.
      # Diagnostics before the chain, never a gate: one small compile, then the
      # compiler's own source lexed, parsed and compiled, each with its exit
      # code -- so a crash in the chain below is already localised here.
