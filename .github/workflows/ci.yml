      # Both halves, on a QEMU that is not the owner's: the exact transcript and
      # the exit code the SiFive test device passes through. `timeout` exists
      # here (it does not on macOS, which is why examples/kernel/test.sh has its
      # own watchdog); 124 is its own failure, distinct from a wrong transcript.
