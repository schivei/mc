# Site — builds the documentation website and deploys it to GitHub Pages.
# Since M27 the site is rendered by `mcsite`, the generator written in mc
# (site/gen, built by `mc build site`). See docs/ci.md.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: "pages" is the group
# GitHub's own Pages actions expect.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # macOS because building the real site needs `mc`, which only runs there.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # M27: site/gen/*.mc is the generator. `mc build site` compiles it into
      # build/mcsite (site/mc.toml); running it renders docs/ into site/public.
      # --check validates every internal link and runs site/tools/checkhtml.py
      # and site/tools/contrast.py, which is why nothing else here checks HTML.
      - name: Build with mcsite
        run: |
          set -eu
          make mc1
          build/mc1 build site
          build/mcsite site --check

      - name: Assemble public/ from the generated site
        run: |
          set -eu
          rm -rf public
          cp -R site/public public
          ls -R public | head -50

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
