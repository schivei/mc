# Tag — the manual escape hatch. Every ordinary release is cut by autotag.yml
# when a pull request is merged; this workflow exists for the cases that are not
# ordinary: a version that has to skip a number, a re-release after a tag was
# deleted, or a release for a commit that reached main without a pull request.
# Run it by hand from the Actions tab. See docs/ci.md.
name: Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, X.Y.Z (must be newer than the newest existing tag)"
        required: true
        type: string
      notes:
        description: "Release notes; they become the tag's annotation and the release body"
        required: false
        type: string

permissions:
  # contents: write pushes the tag; actions: write starts release.yml.
  contents: write
  actions: write

concurrency:
  # The same group as autotag.yml: a hand-made tag and a merge-made tag must
  # never race for the same version number.
  group: autotag
  cancel-in-progress: false

jobs:
  tag:
    name: Create and push vX.Y.Z
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history and tags: the version has to beat the newest tag, and
          # the annotation is written against this commit.
          fetch-depth: 0

      # The input is read from the environment, never interpolated into the
      # script: a workflow input is untrusted text. There is no VERSION file to
      # agree with -- since the move to pull-request releases the tags are the
      # only source of truth (docs/ci.md § Versioning).
      - name: Validate the version against the newest tag
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -eu
          v="$VERSION_INPUT"
          if ! scripts/next-version.sh "$v" patch > /dev/null 2>&1; then
            echo "::error::'$v' is not a plain semantic version X.Y.Z"
            echo "::error::pre-release suffixes and leading zeros are not accepted (docs/ci.md)"
            exit 1
          fi
          v="${v#v}"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
            echo "::error::the tag v$v already exists"
            exit 1
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$latest" ]; then
            if ! scripts/next-version.sh --gt "$v" "$latest"; then
              echo "::error::'$v' is not newer than the newest tag '$latest'"
              exit 1
            fi
            echo "$v is newer than $latest"
          else
            echo "no v* tag exists yet: $v is the first"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Create and push the annotated tag
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The annotation is the release body, so the subject line matters.
          {
            echo "mc v$VERSION"
            if [ -n "${NOTES:-}" ]; then
              echo
              printf '%s\n' "$NOTES"
            fi
          } > "$RUNNER_TEMP/annotation.txt"
          git tag -a "v$VERSION" -F "$RUNNER_TEMP/annotation.txt"
          git push origin "refs/tags/v$VERSION"
          echo "pushed refs/tags/v$VERSION"

      # A tag PUSHED with GITHUB_TOKEN does not start release.yml -- GitHub's
      # guard against recursive runs. `workflow_dispatch` and
      # `repository_dispatch` are the two documented exceptions to that guard,
      # so dispatching the release explicitly works with the same token. The
      # dispatch targets the tag's own ref, so the release is built from the
      # workflow definition that was tagged.
      - name: Start release.yml for the new tag
        id: dispatch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
          echo "dispatched release.yml for v$VERSION"

      - name: Summary
        run: |
          set -eu
          {
            echo "### Tagged \`v$VERSION\`"
            echo
            if [ "$DISPATCH" = success ]; then
              echo "**release.yml was started** for \`v$VERSION\`. Watch it under Actions -> Release."
            else
              echo "The tag is pushed, but **starting release.yml failed** (see the step above)."
              echo "Start it by hand: Actions -> Release -> Run workflow -> tag \`v$VERSION\`."
              echo
              echo "The usual cause is Actions permissions: the workflow needs \`actions: write\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DISPATCH: ${{ steps.dispatch.outcome }}
