# mc.toml — the taught compiler for examples/kernel and the kernel image it
# writes, both driven by `mc build`:
#
#   ../../build/mc1 build examples/kernel            # from the repository root
#   ../../build/mc1 build                            # from inside here
#
# That is two processes, the shape `mc build` has had since M14: the parent
# assembles build/mc-kernel out of `<mc/core>` + this directory's modules, then
# spawns it as `mc-kernel build DIR --config FILE --entry-only`, and the CHILD
# compiles main.mc into build/kernel.bin. `--compiler-only` stops after the
# first half and prints the compiler's path; the single-file CLI
#
#   build/mc-kernel --backend=rv-image --include=lib main.mc -o build/kernel.bin
#
# still does the second half on its own, and is what examples/kernel/test.sh
# uses for the sources that are not [project].entry.
#
# M39.5 is what made the `[target]` below possible. `none/riscv64` is not a pair
# the running `mc` knows: mc-kernel.mc registers it with `target("none",
# "riscv64", "rv-image", "rv-image")`, and `mc build` resolves [target] AFTER
# `user_init()` has run (docs/specs/M39.md § Gaps, G1 -- the deferral form).
# Until M39.5 the parent refused the pair before the taught compiler existed,
# and the second step had to be the CLI above.

[project]
name  = "kernel"
entry = "main.mc"
out   = "build/kernel.bin"
kind  = "exe"

# The compiler that compiles the kernel is not the one running: a RISC-V 64
# machine, a flat-image backend and four bare-metal words come from
# mc-kernel.mc, which pulls the core out of the running binary's own bundle
# (`#include <mc/core>`). There is no path into src/ anywhere in this directory.
[compiler]
modules = ["mc-kernel.mc"]
out     = "build/mc-kernel"

# A bare-metal board is not an operating system, and `none` says exactly that.
# The pair reaches the registry from mc-kernel.mc's `user_init`, and `rv-image`
# sits in the EXE slot: the flat image IS the final artefact, so there is no
# object step and no [linker] -- `kind = "exe"` above writes build/kernel.bin
# directly, the way `macho-exe` writes a signed binary on macOS.
[target]
os   = "none"
arch = "riscv64"

# The reserve `mc build` takes from the estimate, before any table exists. The
# static estimate is a function of source BYTES and a taught compiler this size
# lands about twice its prediction, so the default 0.25 makes the `nodes` and
# `ins` tables double mid-build. At 1.0 nothing grows in THAT half -- `mc limits
# examples/kernel` is what reports it.
#
# The entry half is a different story and it is not a defect. main.mc is 90
# lines, and `mmio`/`csrw`/`yield` plus the six `#rule stmt:` of <prelude>
# expand into about five times the nodes those bytes predict -- a factor no
# tolerance in [0, 1] can cover. So a COLD `mc limits examples/kernel` reports
# `grew` for the entry and exits 3, and the usage `mc build` remembers in
# build/.mc-usage.toml is what makes the next one exit 0 with grow 0 everywhere:
# exit 3 cold and exit 0 remembered, the shape M23 recorded for examples/api.
# examples/kernel/test.sh step 8 asserts both phases.
[limits]
tolerance = 1.0

# The bare-metal layer lives in lib/. `#include "sys_bare.mc"` already resolves
# against main.mc's own directory; this root is what lets the same three files
# be included by bare name from anywhere in the project, and it is the
# `--include=lib` of the direct CLI above.
[include]
paths = ["lib"]
