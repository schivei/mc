# mc.linux-x86_64-gnu.toml — cross-building `mc` itself for a linux/x86_64 HOST
# that runs GLIBC (M42 § acceptance 9, docs/guide/90-linux-host.md).
#
#   build/mc1 build src --config src/mc.linux-x86_64-gnu.toml
#   -> build/mc-linux-x86_64-gnu   a DYNAMIC ELF64 executable, no linker
#
# It is src/mc.linux-x86_64.toml with ONE key added and nothing else changed.
# `libc` names the FAMILY, and the family picks both per-libc names at once --
# the DT_NEEDED soname (`libc.so.6`) and the loader path
# (`/lib/ld-linux-<arch>.so.1`, `/lib64/ld-linux-x86-64.so.2`). `musl` is the
# writer's default and the other half of the same axis
# (docs/reference/toml.md, the [target] section).
#
# The OBJECT this compiler writes does not depend on either of them, which is
# what makes the glibc chain's golden the same value as the musl chain's:
# tests/golden/mc2-linux-x86_64.sha256, one file for both.
#
# Every path below is relative to THIS FILE's directory (src/).

[project]
name  = "mc-linux-x86_64-gnu"
entry = "mc_linux_x86_64.mc"
out   = "../build/mc-linux-x86_64-gnu"
kind  = "exe"

[target]
os     = "linux"
arch   = "x86_64"
libc   = "gnu"

# same reason as the musl config: the compiler compiling itself is the biggest
# source here, and at 0.25 several tables double mid-build.
[limits]
tolerance = 1.0
